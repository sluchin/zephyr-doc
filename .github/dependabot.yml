# Dependabot: 依存の更新を, 週に 1 回 PR にする (マイナー版とパッチ版は, 種類ごとに 1 つの PR にまとめる).
# PR では, いつもの CI が走る. マージは手で行う.
# cargo は入れない (shared のサブモジュールを path で使うが, Dependabot はサブモジュールを取らない).
# Rust の依存は doc-translator-core で更新して, サブモジュールの更新で取り込む.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "gradle"
    directories:
      - "/src-tauri/gen/android"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "gitsubmodule"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
